<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户注册</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      min-height: 100vh; /* 改为min-height避免移动端溢出 */
      padding: 2rem;
      background-color: #f0f2f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 登录卡片容器 */
    .register-container {
      background-color: #ffffff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 500px; /* 缩小宽度更符合注册表单习惯 */
      margin: 0 auto; /* 替代transform居中，更稳定 */
    }

    /* 标题 */
    .register-container__title {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 2rem;
      color: #333;
    }

    /* 表单容器 */
    .register-form {
      display: flex;
      flex-direction: column;
      gap: 1.2rem; /* 加大表单项间距 */
    }

    /* 单个表单项容器 */
    .form-item {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    /* 表单标签 */
    .form-item__label {
      font-size: 1rem;
      color: #555;
      font-weight: 500;
    }

    /* 表单输入框 */
    .form-item__input {
      padding: 0.9rem 1rem;
      font-size: 1rem;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-item__input:focus {
      outline: none;
      border-color: #2d81ff;
      box-shadow: 0 0 0 3px rgba(45, 129, 255, 0.1);
    }

    /* 性别单选按钮组 */
    .form-item__radio-group {
      display: flex;
      gap: 1.5rem;
      padding: 0.5rem 0;
    }

    .form-item__radio-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1rem;
      color: #555;
      cursor: pointer;
    }

    /* 提交按钮 */
    .register-form__submit-btn {
      background-color: #2d81ff;
      color: white;
      border: none;
      padding: 1rem;
      font-size: 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background-color 0.2s;
    }

    .register-form__submit-btn:hover {
      background-color: #1a66d4;
    }

    .register-form__submit-btn:disabled {
      background-color: #a0c8ff;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <h1 class="register-container__title">用户注册</h1>

    <form class="register-form" id="registerForm">
      <!-- 用户名 -->
      <div class="form-item">
        <label class="form-item__label" for="name">用户名</label>
        <input
          type="text"
          id="name"
          name="name"
          class="form-item__input"
          placeholder="请输入用户名"
          required
          minlength="2"
        />
      </div>

      <!-- 年龄 -->
      <div class="form-item">
        <label class="form-item__label" for="age">年龄</label>
        <input
          type="number"
          id="age"
          name="age"
          class="form-item__input"
          placeholder="请输入年龄（0-150）"
          min="0"
          max="150"
          required
        />
      </div>

      <!-- 性别（改为单选按钮） -->
      <div class="form-item">
        <label class="form-item__label">性别</label>
        <div class="form-item__radio-group">
          <label class="form-item__radio-label">
            <input type="radio" name="gender" value="男" required />
            男
          </label>
          <label class="form-item__radio-label">
            <input type="radio" name="gender" value="女" required />
            女
          </label>
        </div>
      </div>

      <!-- 民族（改为下拉框） -->
      <div class="form-item">
        <label class="form-item__label" for="nation">民族</label>
        <select id="nation" name="nation" class="form-item__input" required>
          <option value="">请选择民族</option>
          <option value="汉族">汉族</option>
          <option value="蒙古族">蒙古族</option>
          <option value="回族">回族</option>
          <option value="藏族">藏族</option>
          <option value="维吾尔族">维吾尔族</option>
          <option value="其他">其他</option>
        </select>
      </div>

      <!-- 手机号 -->
      <div class="form-item">
        <label class="form-item__label" for="phone">手机号</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          class="form-item__input"
          placeholder="请输入11位手机号"
          pattern="1[3-9]\d{9}"
          required
        />
      </div>

      <button type="submit" class="register-form__submit-btn" id="submitBtn">
        提交注册
      </button>
    </form>
  </div>

  <script src="./node_modules/axios/dist/axios.min.js"></script>
  <script>
    const registerForm = document.getElementById('registerForm');
    const submitBtn = document.getElementById('submitBtn');

    // 监听表单submit事件
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault(); // 阻止表单默认提交刷新

      // 收集表单数据
      const formData = new FormData(registerForm);
      const newUser = Object.fromEntries(formData.entries());

      // 禁用按钮防止重复提交
      submitBtn.disabled = true;
      submitBtn.textContent = '提交中...';

      try {
        // 发送请求
        const res = await axios({
          url: 'http://localhost:3000/users',
          method: 'post',
          data: newUser,
        });

        // 假设服务器返回201表示创建成功
        if (res.status === 201 || res.status === 200) {
          window.location.href = './index.html';
        }
      } catch (err) {
        console.error('注册失败:', err);
        alert('注册失败，请稍后重试');
      } finally {
        // 恢复按钮状态
        submitBtn.disabled = false;
        submitBtn.textContent = '提交注册';
      }
    });
  </script>
</body>
</html>
